name: Shared Datadog Catalog Updater
on:
  workflow_call: # This makes it reusable
    secrets:
      DD_API_KEY:
        required: true
      DD_APP_KEY:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Datadog Service Catalog Metadata Provider
        uses: arcxp/datadog-service-catalog-metadata-provider@e909e3743d666eb3de9a54dbbe2f1251257ac93f # v2.3.2
        with:
          # You can define defaults here
          service-definition: service.datadog.yaml 
          datadog-key: ${{ secrets.DD_API_KEY }}
          datadog-app-key: ${{ secrets.DD_APP_KEY }}
